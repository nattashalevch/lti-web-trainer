<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тренажёр: HTML и CSS</title>
<style>
  :root {
    --page: #e9eef5; --panel: #ffffff; --ink: #16213a; --muted: #5b6785;
    --line: #cfd8e6; --accent: #2257d6; --ok: #17794b; --bad: #b3261e;
    --ok-bg: #e4f4ec; --bad-bg: #fbe9e7; --code-bg: #f4f7fb;
    --mono: ui-monospace, "SF Mono", Consolas, "Liberation Mono", monospace;
    --sans: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #0f1626; --panel: #172036; --ink: #e8edf8; --muted: #9aa7c4;
      --line: #2b3858; --accent: #7aa2ff; --ok: #5fd39a; --bad: #ff8a80;
      --ok-bg: #12301f; --bad-bg: #3a1a1a; --code-bg: #101a2e;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 16px/1.5 var(--sans); }
  main { max-width: 760px; margin: 0 auto; padding: 28px 18px 64px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; letter-spacing: -0.01em; }
  .meta { color: var(--muted); font-size: .9rem; margin: 0 0 24px; }
  .rule { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; margin: 0 0 16px; overflow: hidden; }
  .rule-head { display: flex; justify-content: space-between; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--code-bg); font: .85rem var(--mono); color: var(--muted); }
  .rule-body { padding: 14px 16px 16px; }
  .q { margin: 0 0 4px; }
  .hint { margin: 0 0 12px; color: var(--muted); font-size: .88rem; }
  .decl { display: flex; align-items: center; gap: 8px; font: 1rem var(--mono); }
  .decl label { color: var(--accent); white-space: nowrap; }
  .decl input { flex: 1; min-width: 0; font: inherit; color: var(--ink); background: var(--code-bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
  .decl input:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .rule.correct { border-color: var(--ok); }
  .rule.correct .rule-head { background: var(--ok-bg); color: var(--ok); }
  .rule.wrong { border-color: var(--bad); }
  .rule.wrong .rule-head { background: var(--bad-bg); color: var(--bad); }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 8px; }
  button { font: 600 1rem var(--sans); border-radius: 8px; border: 1px solid var(--accent); padding: 10px 18px; cursor: pointer; background: var(--accent); color: #fff; }
  @media (prefers-color-scheme: dark) { button { color: #0f1626; } }
  button.ghost { background: transparent; color: var(--accent); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .progress { color: var(--muted); font-size: .9rem; }
  .banner { border-radius: 8px; padding: 12px 16px; margin: 0 0 16px; border: 1px solid var(--line); background: var(--panel); }
  .banner.ok { border-color: var(--ok); background: var(--ok-bg); }
  .banner.bad { border-color: var(--bad); background: var(--bad-bg); }
  .banner strong { font-size: 1.15rem; }
  h2 { font-size: 1.05rem; margin: 28px 0 8px; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; font-size: .92rem; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; background: var(--code-bg); }
  tr:last-child td { border-bottom: 0; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: no-preference) { .rule { transition: border-color .2s; } }
</style>
</head>
<body>
<main>
  <h1>HTML и CSS: три задания</h1>
  <p class="meta" id="meta">Загрузка…</p>

  <div id="banner" class="banner" hidden role="status"></div>
  <form id="quiz" autocomplete="off"></form>

  <div class="actions">
    <button id="submit" type="button" disabled>Проверить и отправить в Moodle</button>
    <button id="resend" type="button" class="ghost" hidden>Отправить результат повторно</button>
    <button id="again" type="button" class="ghost" hidden>Новая попытка</button>
    <span class="progress" id="progress"></span>
  </div>

  <h2>Мои попытки</h2>
  <table>
    <thead><tr><th>№</th><th>Результат</th><th>Время</th><th>Статус</th></tr></thead>
    <tbody id="history"></tbody>
  </table>
</main>

<script>
const ltik = new URLSearchParams(location.search).get('ltik');
const $ = (id) => document.getElementById(id);
const STATUS = { sent: 'отправлена в Moodle', failed: 'не отправлена', pending: 'отправляется' };
let state = null;

async function api(path, method = 'GET', body) {
  const res = await fetch(`${path}?ltik=${encodeURIComponent(ltik)}`, {
    method,
    headers: body ? { 'Content-Type': 'application/json' } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Ошибка ${res.status}`);
  return data;
}

function banner(text, kind) {
  const el = $('banner');
  el.className = `banner ${kind || ''}`;
  el.replaceChildren();
  const strong = document.createElement('strong');
  strong.textContent = text.title;
  el.append(strong);
  if (text.note) el.append(document.createElement('br'), text.note);
  el.hidden = false;
}

function renderQuiz() {
  const form = $('quiz');
  form.replaceChildren();
  state.questions.forEach((q) => {
    const rule = document.createElement('section');
    rule.className = 'rule';
    rule.id = `rule-${q.id}`;
    rule.innerHTML = `
      <div class="rule-head"><span>${q.topic} / ${q.id}</span><span>${q.weight} б.</span></div>
      <div class="rule-body">
        <p class="q"></p><p class="hint"></p>
        <div class="decl"><label for="in-${q.id}">ответ:</label><input id="in-${q.id}" name="${q.id}" spellcheck="false" autocapitalize="off"></div>
      </div>`;
    rule.querySelector('.q').textContent = q.text;
    rule.querySelector('.hint').textContent = q.hint;
    form.append(rule);
  });
  form.oninput = updateProgress;
  updateProgress();
}

function answers() {
  return Object.fromEntries(state.questions.map((q) => [q.id, $(`in-${q.id}`).value]));
}

function updateProgress() {
  const filled = Object.values(answers()).filter((v) => v.trim()).length;
  $('progress').textContent = `Заполнено ${filled} из ${state.questions.length}`;
  $('submit').disabled = !state.isLearner || filled === 0 || hasFailed();
}

const hasFailed = () => state.attempts.some((a) => a.status === 'failed');

function renderHistory() {
  const body = $('history');
  body.replaceChildren();
  if (!state.attempts.length) {
    const tr = body.insertRow();
    const td = tr.insertCell();
    td.colSpan = 4;
    td.textContent = 'Попыток пока нет. Заполните ответы и нажмите кнопку отправки.';
    return;
  }
  state.attempts.forEach((a, i) => {
    const tr = body.insertRow();
    tr.insertCell().textContent = i + 1;
    tr.insertCell().textContent = `${a.score}/${a.max}`;
    tr.insertCell().textContent = new Date(a.at).toLocaleString('ru-RU');
    tr.insertCell().textContent = STATUS[a.status] || a.status;
  });
}

function markResult(attempt) {
  state.questions.forEach((q) => {
    const rule = $(`rule-${q.id}`);
    rule.classList.remove('correct', 'wrong');
    rule.classList.add(attempt.details[q.id] ? 'correct' : 'wrong');
    $(`in-${q.id}`).readOnly = true;
  });
}

function showAttempt(attempt) {
  markResult(attempt);
  if (attempt.status === 'sent') {
    banner({ title: `Результат: ${attempt.score}/${attempt.max}`, note: 'Moodle принял оценку. Проверьте журнал оценок курса.' }, 'ok');
  } else {
    banner({ title: `Результат: ${attempt.score}/${attempt.max}`, note: 'Оценка пока не дошла до Moodle. Нажмите «Отправить результат повторно».' }, 'bad');
  }
  $('submit').hidden = true;
  $('resend').hidden = attempt.status !== 'failed';
  $('again').hidden = attempt.status === 'failed';
}

async function init() {
  if (!ltik) { $('meta').textContent = 'Откройте тренажёр из элемента курса в Moodle.'; return; }
  try {
    state = await api('/api/state');
  } catch (e) {
    $('meta').textContent = 'Сессия не найдена. Откройте тренажёр из Moodle заново.';
    return;
  }
  $('meta').textContent = `Пользователь: ${state.user.name || state.user.id} · курс ${state.courseId} · ресурс ${state.resourceId} · роль: ${state.isLearner ? 'студент' : 'не студент'}`;
  renderQuiz();
  renderHistory();
  if (!state.isLearner) banner({ title: 'Просмотр', note: 'Оценку отправляют только студенты.' });
  if (hasFailed()) {
    banner({ title: 'Есть неотправленный результат', note: 'Нажмите «Отправить результат повторно».' }, 'bad');
    $('resend').hidden = false;
  }
}

$('submit').addEventListener('click', async () => {
  $('submit').disabled = true;
  try {
    const { attempt } = await api('/api/submit', 'POST', { answers: answers() });
    state.attempts.push(attempt);
    renderHistory();
    showAttempt(attempt);
  } catch (e) {
    banner({ title: 'Не удалось отправить', note: e.message }, 'bad');
    updateProgress();
  }
});

$('resend').addEventListener('click', async () => {
  try {
    const { attempt } = await api('/api/resend', 'POST', {});
    const i = state.attempts.findIndex((a) => a.id === attempt.id);
    if (i >= 0) state.attempts[i] = attempt;
    renderHistory();
    showAttempt(attempt);
  } catch (e) {
    banner({ title: 'Повторная отправка не удалась', note: e.message }, 'bad');
  }
});

$('again').addEventListener('click', () => {
  $('banner').hidden = true;
  $('submit').hidden = false;
  $('again').hidden = true;
  renderQuiz();
});

init();
</script>
</body>
</html>
